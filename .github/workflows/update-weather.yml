name: Update weather data

on:
  schedule:
    # Every 5 minutes, offset from :00 to avoid GitHub's busiest cron slots
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weather
  # Finish the in-flight fetch instead of cancelling it when the next tick queues
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Ecowitt cloud data
        env:
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_DEVICE_MAC: ${{ secrets.ECOWITT_DEVICE_MAC }}
        run: node .github/scripts/fetch-ecowitt-data.js

      - name: Log data timestamps
        run: |
          node -e "
            const fs = require('fs');
            for (const f of ['current.json','history-day.json','history-week.json','history-month.json','history-year.json']) {
              const p = 'data/' + f;
              if (!fs.existsSync(p)) { console.log(f, 'MISSING'); continue; }
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              const st = fs.statSync(p);
              console.log(f, 'updatedAt=', j.updatedAt || '(none)', 'mtime=', st.mtime.toISOString());
            }
          "

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Update weather data from Ecowitt cloud"
            git push
          fi
